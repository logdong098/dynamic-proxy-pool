version: '3.8'

services:
  proxy-pool:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dynamic-proxy-pool
    restart: unless-stopped
    ports:
      - "127.0.0.1:18081:18081"
    volumes:
      # Persist SQLite database and Telegram userbot session across restarts
      - ./data:/app/data
      - ./.env:/app/.env:ro
    environment:
      - TZ=Asia/Shanghai
      - PYTHONUNBUFFERED=1
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
